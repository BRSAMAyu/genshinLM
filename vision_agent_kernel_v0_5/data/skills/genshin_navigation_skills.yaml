# Genshin Impact Navigation Skill Templates
# Environment: Genshin Impact 1920x1080

skills:
  teleport_and_navigate_v1:
    skill_id: teleport_and_navigate_v1
    name: "Genshin Teleport and Navigate v1"
    type: navigation
    environment_profile: genshin_1920x1080
    steps:
      - step_id: open_map
        type: action_sequence
        label: "Open world map (M key)"
        timeout_ms: 2000
        params:
          actions:
            - { input: "press_key", key: "m" }

      - step_id: select_waypoint
        type: action_sequence
        label: "Click target waypoint on map"
        timeout_ms: 3000
        params:
          actions:
            - { input: "click_at", target: "map_waypoint" }

      - step_id: confirm_teleport
        type: action_sequence
        label: "Confirm teleport"
        timeout_ms: 2000
        params:
          actions:
            - { input: "press_key", key: "f" }

      - step_id: wait_loading
        type: wait_visual_trigger
        label: "Wait for loading screen to end"
        timeout_ms: 15000
        params:
          trigger: "loading_screen_done"
          chunk_ms: 500

      - step_id: navigate_to_target
        type: move_to_target
        label: "Navigate from teleport to target"
        timeout_ms: 30000
        params:
          method: "minimap_guided"
          stop_distance: 2.0

    visual_triggers:
      loading_screen_done:
        trigger_id: loading_screen_done
        type: screen_state
        detection: loading_screen_disappeared
        roi: "full_screen"

    success_criteria:
      - "arrived_at_target"
      - "visual_action_completed"

    failure_policy:
      max_retries: 2
      fallback: "abort_and_report"
      on_timeout: "abort_step"

    safety:
      dry_run_default: true
      interruptible: true
      require_focus: true
      max_duration_ms: 60000

  minimap_navigate_v1:
    skill_id: minimap_navigate_v1
    name: "Genshin Minimap Navigation v1"
    type: navigation
    environment_profile: genshin_1920x1080
    steps:
      - step_id: read_minimap
        type: checkpoint
        label: "Read minimap for target direction"
        timeout_ms: 500
        params:
          checkpoint: "minimap_target_bearing"

      - step_id: orient_camera
        type: camera_align
        label: "Orient camera toward target"
        timeout_ms: 2000
        params:
          alignment: "bearing"
          bearing_source: "minimap"

      - step_id: move_forward
        type: action_sequence
        label: "Move forward toward target"
        timeout_ms: 5000
        params:
          actions:
            - { input: "hold_key", key: "w", duration_ms: 4000 }

      - step_id: check_arrival
        type: branch_on_visual_state
        label: "Check if arrived at target"
        timeout_ms: 500
        params:
          guard: "distance_to_target < 2.0"

      - step_id: reorient_if_needed
        type: camera_align
        label: "Reorient if off-course"
        timeout_ms: 2000
        params:
          alignment: "bearing"
          bearing_source: "minimap"
          condition: "distance_to_target >= 2.0"

    visual_triggers:
      minimap_target_bearing:
        trigger_id: minimap_target_bearing
        type: minimap_reading
        detection: minimap_waypoint_direction
        roi: "minimap"

    success_criteria:
      - "arrived_at_target"
      - "visual_action_completed"

    failure_policy:
      max_retries: 5
      fallback: "stop_and_reacquire"
      on_timeout: "abort_step"

    safety:
      dry_run_default: true
      interruptible: true
      require_focus: true
      max_duration_ms: 60000

  handle_dialog_v1:
    skill_id: handle_dialog_v1
    name: "Genshin NPC Dialog Handler v1"
    type: navigation
    environment_profile: genshin_1920x1080
    steps:
      - step_id: approach_npc
        type: move_to_target
        label: "Approach NPC"
        timeout_ms: 8000
        params:
          method: "minimap_guided"
          stop_distance: 1.0

      - step_id: interact_npc
        type: action_sequence
        label: "Press F to start dialog"
        timeout_ms: 1000
        params:
          actions:
            - { input: "press_key", key: "f" }

      - step_id: advance_dialog
        type: action_sequence
        label: "Advance dialog (click / space)"
        timeout_ms: 15000
        params:
          actions:
            - { input: "press_key", key: "space" }
          loop_until: "dialog_ended"

      - step_id: wait_dialog_end
        type: wait_visual_trigger
        label: "Wait for dialog to end"
        timeout_ms: 10000
        params:
          trigger: "dialog_ended"
          chunk_ms: 200

    visual_triggers:
      dialog_ended:
        trigger_id: dialog_ended
        type: screen_state
        detection: dialog_box_disappeared
        roi: "dialog_area"

    success_criteria:
      - "dialog_completed"
      - "visual_action_completed"

    failure_policy:
      max_retries: 2
      fallback: "skip_dialog"
      on_timeout: "abort_step"

    safety:
      dry_run_default: true
      interruptible: true
      require_focus: true
      max_duration_ms: 30000

  return_to_safe_anchor_v1:
    skill_id: return_to_safe_anchor_v1
    name: "Genshin Return to Safe Anchor v1"
    type: navigation
    environment_profile: genshin_1920x1080
    steps:
      - step_id: open_map
        type: action_sequence
        label: "Open world map"
        timeout_ms: 2000
        params:
          actions:
            - { input: "press_key", key: "m" }

      - step_id: select_city_waypoint
        type: action_sequence
        label: "Select city teleport waypoint"
        timeout_ms: 3000
        params:
          actions:
            - { input: "click_at", target: "city_teleport_waypoint" }

      - step_id: confirm_teleport
        type: action_sequence
        label: "Confirm teleport to city"
        timeout_ms: 2000
        params:
          actions:
            - { input: "press_key", key: "f" }

      - step_id: wait_loading
        type: wait_visual_trigger
        label: "Wait for loading screen"
        timeout_ms: 15000
        params:
          trigger: "loading_screen_done"
          chunk_ms: 500

      - step_id: verify_safe_location
        type: checkpoint
        label: "Verify arrival at safe location"
        timeout_ms: 3000
        params:
          checkpoint: "city_location_confirmed"

    visual_triggers:
      loading_screen_done:
        trigger_id: loading_screen_done
        type: screen_state
        detection: loading_screen_disappeared
        roi: "full_screen"

    success_criteria:
      - "arrived_at_safe_anchor"
      - "visual_action_completed"

    failure_policy:
      max_retries: 3
      fallback: "emergency_stop"
      on_timeout: "abort_step"

    safety:
      dry_run_default: true
      interruptible: true
      require_focus: true
      max_duration_ms: 30000

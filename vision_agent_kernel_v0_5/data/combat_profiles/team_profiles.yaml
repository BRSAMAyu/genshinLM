# Genshin Impact Team Combat Profiles
# Sparkle Project - Vision Agent Kernel v0.5
# Each team includes rotation, resonance, strengths, and weaknesses.

teams:
  - team_id: national
    display_name: National Team (国家队)
    members:
      - xiangling
      - bennett
      - xingqiu
      - sucrose
    resonance: none
    recommended_rotation:
      - "Xingqiu E > Q (apply hydro)"
      - "Sucrose E (VV shred, share EM)"
      - "Bennett Q > E (buff ATK)"
      - "Xiangling Q > E (pyronado vaporize)"
      - "Sucrose N2C to funnel particles"
    strengths:
      - "High sustained DPS through Xiangling vaporize"
      - "Bennett provides ATK buff and healing"
      - "Sucrose VV shred and EM share amplifies reactions"
      - "Low investment, high return team"
    weaknesses:
      - "No defensive utility beyond Bennett heal"
      - "Requires good energy management"
      - "Xiangling needs high ER (200%+) before stacking offensive stats"


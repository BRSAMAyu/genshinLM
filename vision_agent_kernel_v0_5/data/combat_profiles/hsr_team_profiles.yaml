# Honkai: Star Rail Team Combat Profiles
# Sparkle Project - Vision Agent Kernel v0.5
# Data sourced from prydwen.gg, game8.co, HoYoLAB, and community meta discussions.
# Covers Memory of Chaos (MoC), Pure Fiction (PF), and Apocalyptic Shadow (AS).
# Character IDs use snake_case English names. Paths and elements match HSR terminology.

teams:

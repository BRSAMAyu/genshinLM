  # ACHERON TEAMS (Nihility hypercarry, debuff-stack into ultimate)
  # =====================================================================
  - team_id: acheron_hyper
    name: 黄泉单核队
    name_en: Acheron Hypercarry
    characters: [acheron, jiaoqiu, cipher, aventurine]
    elements: [lightning, fire, lightning, imaginary]
    paths: [nihility, nihility, nihility, preservation]
    playstyle: "Stack debuffs to charge Acheron ultimate, then unleash for massive AoE damage"
    sp_balance: balanced
    difficulty: medium
    best_for: [memory_of_chaos, apocalyptic_shadow]
    rotation:
      - "Jiaoqiu skill (apply debuff zones)"
      - "Cipher skill (DEF shred + debuff)"
      - "Aventurine skill (shield + debuff on hit)"
      - "Acheron skill (generate Slashed Dream stacks)"
      - "Acheron ultimate (when fully charged, unleash Nine Rings)"
    strengths:
      - "Massive ultimate damage that ignores weakness type"
      - "Multiple debuffers charge ultimate quickly"
      - "Aventurine provides strong shielding and debuff"
    weaknesses:
      - "Requires two Nihility teammates for max trace bonus"
      - "Energy generation is passive, no battery mechanic"
      - "E2 recommended to replace one Nihility with Harmony"

  - team_id: acheron_dual_nihility

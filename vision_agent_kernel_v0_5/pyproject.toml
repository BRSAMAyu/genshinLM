[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vision-agent-kernel-v0-5"
version = "0.5.0"
description = "Endpoint visual interaction agent kernel for authorized 3D QA and sandbox environments."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [
  { name = "Aurora Vision Agent Kernel Team" }
]
dependencies = [
  "dxcam>=0.0.5",
  "mss>=9.0.1",
  "numpy>=1.26",
  "opencv-python>=4.9",
  "pyyaml>=6.0.1",
  "ultralytics>=8.2",
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.10",
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
]
testbed = [
  "pygame>=2.5",
  "PyOpenGL>=3.1.7",
]

[tool.setuptools]
packages = [
  "core",
  "perception",
  "control",
  "execution",
  "orchestration",
  "telemetry",
  "testbed",
  "app_service",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ANN"]
ignore = [
  "ANN101",
  "ANN102",
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true

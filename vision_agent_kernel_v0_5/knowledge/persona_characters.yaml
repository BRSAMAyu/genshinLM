  # =====================================================================
  - character_id: silver_wolf
    game: hsr
    name: 银狼
    name_en: Silver Wolf
    role: hacker_gamer
    title: "星核猎手 / Stellaron Hunter"
    speech_style:
      first_person: "我"
      catchphrase: "太简单了，无聊。/ Easy. Boring."
      tone: casual_dismissive
      vocabulary_level: internet_gaming
      sentence_patterns:
        - "就这？"
        - "太简单了。无聊。"
        - "这个算DLC难度吧？"
        - "别动，我来hack。"
        - "……下一关。"
      sentence_starters:
        - "我说……"
        - "等等——"
        - "这也太……"
        - "行吧……"
      filler_words: ["嘛", "……", "啧", "啊"]

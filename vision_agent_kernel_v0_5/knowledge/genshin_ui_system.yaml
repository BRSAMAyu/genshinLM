# Genshin Impact Complete UI/UX System Reference
# Sparkle Project - Vision Agent Kernel v0.5
# Researched from official wiki, HoYoLAB patch notes, Game8, DefKey
# All coordinates relative to 1920x1080 reference resolution
# Last updated: 2026-05-30 (covers through v5.7)

# =============================================================================
# SECTION 1: KEY BINDINGS (Complete PC Control Map)
# =============================================================================
key_bindings:
  movement:
    W: "Move forward"
    A: "Move left"
    S: "Move backward"
    D: "Move right"
    Left_Shift: "Sprint (hold) / Continuous sprint (toggle in settings)"
    Right_Mouse: "Sprint (while moving)"
    Space: "Jump / Climb / Glide (while airborne)"
    X: "Drop (while gliding/climbing)"
    Left_Ctrl: "Walk mode (hold, slower movement)"

  combat:
    Left_Click: "Normal Attack (press) / Charged Attack (hold)"
    E: "Elemental Skill"
    Q: "Elemental Burst (requires full energy)"
    R: "Aim mode (bow characters) / Toggle aim"
    Middle_Click: "Elemental Sight (hold)"

  character_switch:
    "1": "Switch to character slot 1"
    "2": "Switch to character slot 2"
    "3": "Switch to character slot 3"
    "4": "Switch to character slot 4"
    Alt_1: "Use Elemental Burst for character slot 1 (without switching)"
    Alt_2: "Use Elemental Burst for character slot 2"
    Alt_3: "Use Elemental Burst for character slot 3"
    Alt_4: "Use Elemental Burst for character slot 4"

  interaction:
    F: "Interact / Talk / Pick up / Open"
    Z: "Use equipped gadget"
    V: "Quest navigation (track next quest objective)"
    P: "Abandon current quest navigation"

  menus:
    Esc: "Open Paimon Menu (pause game, central hub)"
    B: "Open Inventory"
    C: "Open Character Menu"
    M: "Open Map"
    J: "Open Quest Menu"
    L: "Open Party Setup"
    G: "Open Tutorials"
    Y: "Open Notifications"
    O: "Open Friends list"
    Enter: "Open Chat"
    Tab: "Open Shortcut Wheel (quick access wheel)"

  function_keys:
    F1: "Adventurer Handbook"
    F2: "Co-Op Mode"
    F3: "Wish (Gacha)"
    F4: "Battle Pass"
    F5: "Events panel"
    F6: "Settings (only in Serenitea Pot / Cat's Tail)"
    F7: "Furnishing Placement (Serenitea Pot)"
    F8: "Stellar Reunion (returning player event, time-limited)"
    U: "Special Environment Info (Dragonspine, etc.)"

  other:
    F12: "Screenshot (saves to Screenshots folder)"
    PrtScn: "Screenshot (fullscreen capture)"
    H: "Hide/show UI (photo mode)"

# =============================================================================
# SECTION 2: PAIMON MENU (Esc - Central Hub)
# =============================================================================
paimon_menu:
  hotkey: "Esc"
  layout:
    description: "Dark semi-transparent overlay covering the game world. Game is paused in single-player."
    profile_section:
      position: "Top-left area"
      contents:
        - "Character avatar (clickable, opens avatar selection)"
        - "Nickname (clickable to edit)"
        - "Signature (clickable to edit)"
        - "Adventure Rank (AR) number"
        - "World Level"
        - "Server name"
        - "UID number"
        - "Namecard background (changes with equipped namecard)"
      edit_buttons:
        - "Edit Nickname (pencil icon next to name)"
        - "Edit Signature (pencil icon next to signature)"
        - "Change Avatar (click avatar portrait)"
        - "Change Namecard (via profile sub-menu)"

    sidebar:
      position: "Left side, below profile"
      buttons:
        - text: "Feedback"
          action: "Opens browser to feedback page"
        - text: "Bug Report"
          action: "Opens browser to bug report page"

    contents_section:
      position: "Center-right, scrollable grid of buttons"
      description: "Large square buttons arranged in a grid, scrollable. Each opens a game system."
      buttons:
        - name: "Inventory"
          icon: "Backpack icon"
          hotkey_shortcut: "B"
        - name: "Character"
          icon: "Character silhouette"
          hotkey_shortcut: "C"
        - name: "Quest Menu"
          icon: "Scroll icon"
          hotkey_shortcut: "J"
        - name: "Map"
          icon: "Map icon"
          hotkey_shortcut: "M"
        - name: "Adventurer Handbook"
          icon: "Book icon"
          hotkey_shortcut: "F1"
        - name: "Wish"
          icon: "Star/shooting star"
          hotkey_shortcut: "F3"
        - name: "Battle Pass"
          icon: "BP shield icon"
          hotkey_shortcut: "F4"
        - name: "Events"
          icon: "Event banner icon"
          hotkey_shortcut: "F5"
        - name: "Co-Op Mode"
          icon: "Multiplayer icon"
          hotkey_shortcut: "F2"
        - name: "Notifications"
          icon: "Bell icon"
          hotkey_shortcut: "Y"
        - name: "Friends"
          icon: "Handshake icon"
          hotkey_shortcut: "O"
        - name: "Party Setup"
          icon: "Party icon"
          hotkey_shortcut: "L"
        - name: "Chat"
          icon: "Chat bubble"
          hotkey_shortcut: "Enter"
        - name: "Tutorials"
          icon: "Question mark"
          hotkey_shortcut: "G"
        - name: "Settings"
          icon: "Gear icon"
          hotkey_shortcut: "no direct hotkey outside Paimon menu (F6 only in Teapot/Cat Tail)"
        - name: "Edit Profile"
          icon: "Profile card"
        - name: "Namecard"
          icon: "Card icon"
        - name: "Achievements"
          icon: "Trophy icon"
        - name: "Character Archive"
          icon: "Book with faces"
        - name: "Weapon Archive"
          icon: " crossed swords"
        - name: "Viewpoint"
          icon: "Camera/eye icon"
        - name: "Living Beings"
          icon: "Animal/paw icon"
        - name: "Travel Seriendipity"
          icon: "Serenitea Pot icon"
        - name: "Geography"
          icon: "Globe icon"
        - name: "Serenitea Pot"
          icon: "Teapot icon"

    close_button:
      position: "Bottom-right or top-right 'X' button"
      hotkey: "Esc again or Right Click"

  navigation:
    open_from: "World HUD (Esc key)"
    close_to: "World HUD (Esc / right-click / click X)"
    sub_menus: "Each button opens the corresponding screen; Esc returns to Paimon menu first, then to world"
    notes: "Two presses of Esc needed: first closes sub-menu, second closes Paimon menu. Some screens bypass Paimon (B, C, M, J, etc. open directly from world)."

  visual_state_changes:
    - "Background dims and blurs when Paimon menu opens"
    - "Game world visible but darkened behind semi-transparent overlay"
    - "Selected button highlights with golden border"
    - "Scroll arrows appear when content exceeds visible area"

  pitfalls:
    - "Esc from a sub-menu returns to Paimon menu, NOT to world - need second Esc press"
    - "Game is paused in single-player but NOT paused in Co-Op"
    - "Profile section edit buttons are small and easy to miss-click"
    - "Contents section scrolls - buttons below fold may be invisible"

# =============================================================================
# SECTION 3: CHARACTER MENU (C)
# =============================================================================
character_menu:
  hotkey: "C"
  layout:
    description: "Full-screen overlay showing selected character model with tab navigation on the right side."
    character_display:
      position: "Center-left, large area"
      contents:
        - "3D character model (rotatable by dragging)"
        - "Character name and constellation"
        - "Level display with ascension indicator"
        - "Element icon"

    right_panel:
      position: "Right side of screen"
      contents:
        - "Character portrait (small, top-right)"
        - "Stats summary (HP, ATK, DEF, EM, Crit Rate, Crit DMG, ER, Element DMG Bonus)"
        - "Active tab content (varies by sub-tab)"

    tab_bar:
      position: "Right side, vertical tab strip"
      tabs:
        - name: "Profile/Details"
          icon: "Character silhouette"
          description: "Character overview, level, friendship level, namecard"
        - name: "Weapon"
          icon: "Sword/weapon icon"
          description: "Equipped weapon, refine, upgrade"
        - name: "Artifacts"
          icon: "Goblet artifact icon"
          description: "5 artifact slots (Flower, Plume, Sands, Goblet, Circlet)"
        - name: "Talents"
          icon: "Star talent icon"
          description: "Normal Attack, Elemental Skill, Elemental Burst levels and upgrade"
        - name: "Constellation"
          icon: "Star constellation icon"
          description: "6 constellation nodes (C1-C6)"

    character_list:
      position: "Bottom strip, horizontal scrollable"
      description: "All owned character portraits in a row. Click to switch character view."
      current_indicator: "Golden border around currently viewed character"

  sub_tabs:
    details:
      layout: "Character model center, stats on right, level + friendship on left"
      actions:
        - "View character stats"
        - "Check friendship level and rewards"
        - "Preview namecard"

    weapon:
      layout: "Equipped weapon shown center-right with stats below"
      actions:
        - "Equip: Opens weapon selection grid"
        - "Enhance: Opens enhancement menu (consume fodder weapons + ores)"
        - "Refine: Opens refinement menu (consume duplicate weapon)"
      equip_grid:
        description: "Grid of owned weapons sorted by rarity/level. Click to select, then 'Equip' button."
        filters: "Weapon type filter (Sword, Claymore, Polearm, Bow, Catalyst), Rarity, Level, Equipped/Unequipped"

    artifacts:
      layout: "5 artifact slots arranged in a cross pattern (Flower top, Plume right, Sands center, Goblet left, Circlet bottom)"
      slot_positions:
        flower: "Top slot"
        plume: "Right slot (or second position)"
        sands: "Center slot (or third position)"
        goblet: "Left slot (or fourth position)"
        circlet: "Bottom slot (or fifth position)"
      actions:
        - "Equip: Opens artifact selection for that slot"
        - "Enhance: Opens enhancement with fodder artifacts"
        - "Fast Equip (v4.4+): AI-suggested artifact recommendations"
        - "Auto-Lock (v4.3+): Lock artifacts matching criteria"
        - "Salvage (v5.0+): Destroy artifacts for Artifact XP material (Sanctifying Elixir/Unction)"
        - "Loadouts (v5.7+): Save/load artifact builds per character"
      artifact_details:
        main_stat: "Varies by slot type"
        sub_stats: "0-4 substats depending on enhancement level"
        set_bonus: "2-piece and 4-piece set effects displayed"

    talents:
      layout: "Three talent cards: Normal Attack (left), Elemental Skill (center), Elemental Burst (right)"
      actions:
        - "Upgrade: Consume Talent Books + Boss Drops + Mora to level up"
        - "Preview: See next level values"
      restrictions: "Talent level capped by character ascension phase"

    constellation:
      layout: "6 constellation nodes arranged in character-specific pattern"
      actions:
        - "Activate: Consume Stella Fortuna (duplicate character) to unlock"
        - "Preview: View effect of each constellation"
      restrictions: "Must activate in order (C1 before C2, etc.)"

  navigation:
    open_from: "World HUD (C key) or Paimon Menu -> Character"
    close_to: "Esc returns to world HUD (or Paimon menu if opened from there)"
    character_switch: "Click character portrait in bottom strip to change character without leaving menu"
    tab_switch: "Click tab icons on right side to switch between Details/Weapon/Artifacts/Talents/Constellation"

  visual_state_changes:
    - "Tab highlights with golden border when selected"
    - "Artifact slots glow when empty (indicating missing equipment)"
    - "Character model animates when viewing talents (demonstrates skill)"
    - "Enhancement/upgrade animations play on success"
    - "Constellation nodes light up when activated, grayed out when locked"

  pitfalls:
    - "Easy to accidentally hit 'Enhance' instead of 'Equip' on weapon/artifact screens"
    - "Artifact auto-equip may recommend wrong stats - always verify suggestions"
    - "Talent upgrade materials are specific to character region/day of week"
    - "Can only activate constellations in order - cannot skip"
    - "Bottom character strip scrolls - characters off-screen may be forgotten"

# =============================================================================
# SECTION 4: WEAPONS SCREEN (within Character > Weapon tab)
# =============================================================================
weapons_screen:
  access: "Character Menu > Weapon tab, or Inventory > Weapons tab"
  layout:
    description: "Grid of weapon cards with filter/sort options"
    grid_position: "Center of screen"
    card_info: "Weapon icon, name, rarity stars, level, refinement rank"
    filters:
      position: "Top of grid area"
      options:
        - "Weapon Type: All / Sword / Claymore / Polearm / Bow / Catalyst"
        - "Rarity: All / 5-star / 4-star / 3-star"
        - "Equipped Status: All / Equipped / Unequipped"
    sort_options:
      - "Level (high to low)"
      - "Rarity (high to low)"
      - "Refinement (high to low)"

  actions:
    equip: "Select weapon -> Click 'Equip' -> Confirms if replacing currently equipped weapon"
    enhance: "Select weapon -> Click 'Enhance' -> Opens enhancement panel (drag fodder weapons/ores)"
    refine: "Select weapon -> Click 'Refine' -> Requires duplicate weapon, increases refinement rank (R1-R5)"

  navigation:
    open_from: "Character Menu Weapon tab or Inventory Weapons tab"
    close_to: "Back button or Esc"
    cross_reference: "Weapons equipped on characters show character icon overlay in Inventory"

  visual_state_changes:
    - "Equipped weapons show small character portrait badge"
    - "Selected weapon highlights with golden border"
    - "Enhancement success shows particle animation"
    - "Rarity indicated by background color (gold=5, purple=4, blue=3, green=2, gray=1)"

  pitfalls:
    - "Enhancing consumes ALL dragged materials - verify before confirming"
    - "Refinement requires exact duplicate weapon, not just same type"
    - "Locked weapons cannot be used as enhancement fodder"

# =============================================================================
# SECTION 5: ARTIFACTS SCREEN (within Character > Artifacts tab)
# =============================================================================
artifacts_screen:
  access: "Character Menu > Artifacts tab, or Inventory > Artifacts tab"
  layout:
    description: "5 artifact slots in cross pattern with equip/enhance/salvage options"
    slot_layout:
      flower:
        position: "Top"
        main_stat: "Flat HP (always)"
        substats: "ATK%, DEF%, HP%, EM, Crit Rate, Crit DMG, ER, Flat ATK, Flat DEF"
      plume:
        position: "Right or second"
        main_stat: "Flat ATK (always)"
        substats: "Same pool as Flower"
      sands:
        position: "Center or third"
        main_stat: "HP% / DEF% / ATK% / EM / ER"
        substats: "Varies"
      goblet:
        position: "Left or fourth"
        main_stat: "HP% / DEF% / ATK% / EM / Physical DMG% / Elemental DMG% (any element)"
        substats: "Varies"
      circlet:
        position: "Bottom or fifth"
        main_stat: "HP% / DEF% / ATK% / EM / Crit Rate% / Crit DMG% / Healing Bonus%"
        substats: "Varies"

  management_features:
    auto_lock_v43:
      version: "4.3+"
      description: "Automatically lock artifacts matching user-defined criteria"
      criteria: "Set by main stat, substats, rarity (4-star and 5-star only)"
      trigger: "When artifact is obtained (domain, boss, etc.)"

    fast_equip_v44:
      version: "4.4+"
      description: "AI recommends artifacts based on common builds"
      trigger: "Click 'Fast Equip' button on artifact tab"
      note: "Recommendations are community-average, may not match optimal build"

    salvage_v50:
      version: "5.0+"
      description: "Destroy artifacts for Artifact XP materials (Sanctifying Unction/Elixir)"
      trigger: "Select artifacts -> Click 'Salvage'"
      restrictions: "Locked artifacts cannot be salvaged. Only 4-star and 5-star for Elixir."

    loadouts_v57:
      version: "5.7+"
      description: "Save and load complete artifact builds per character"
      slots: "Multiple loadout slots per character"
      trigger: "Artifact tab -> Loadout button"
      actions:
        - "Save current build as loadout"
        - "Load saved build (swaps artifacts)"
        - "Rename loadout"
        - "Delete loadout"

  enhancement:
    description: "Level up artifact using other artifacts as fodder"
    max_level:
      "5-star": 20
      "4-star": 16
      "3-star": 12
      "2-star": 8
      "1-star": 4
    cost: "Mora per enhancement (scales with artifact rarity and level)"

  navigation:
    open_from: "Character Menu > Artifacts tab"
    close_to: "Esc or back button"

  visual_state_changes:
    - "Empty slots show placeholder with '+' icon"
    - "Set bonus text highlights in gold when 2-piece or 4-piece is active"
    - "Substats appear/glow when enhancement milestone reached (+4 per substat unlock)"
    - "Locked artifacts show padlock icon overlay"

  pitfalls:
    - "Salvage is IRREVERSIBLE - locked artifacts are safe but unlock before salvage is dangerous"
    - "Fast Equip may replace good artifacts with mediocre ones"
    - "Goblet main stat is the hardest to get right (elemental DMG% is rare)"
    - "5 artifacts, each with different main stat pools - slot-specific understanding required"

# =============================================================================
# SECTION 6: INVENTORY (B)
# =============================================================================
inventory:
  hotkey: "B"
  layout:
    description: "Full-screen overlay with category tabs on left, item grid in center, item details on right."
    tab_bar:
      position: "Left side, vertical tabs"
      tabs:
        - name: "Weapons"
          icon: "Crossed swords"
          capacity: 2000
          sub_categories: "Sword, Claymore, Polearm, Bow, Catalyst"
        - name: "Artifacts"
          icon: "Goblet"
          capacity: 2400
          sub_categories: "Flower, Plume, Sands, Goblet, Circlet"
        - name: "Character Development Items"
          icon: "Character EXP icon"
          capacity: 2300
          sub_categories: "EXP Materials, Ascension Materials, Talent Materials, Common Materials"
        - name: "Food"
          icon: "Plate/food icon"
          capacity: 2300
          sub_categories: "Recovery Food, Attack Food, Defense Food, Stamina Food, Other Food, Ingredients"
          max_stack:
            most_food: 2000
            special_dishes: 2000
        - name: "Materials"
          icon: "Ore/ingot icon"
          capacity: 2300
          sub_categories: "Forging Materials, Wood, Crafting Materials, Fish Bait"
          max_stack:
            enhancement_ore: 99999
            most_materials: 9999
        - name: "Gadgets"
          icon: "Compass/gadget icon"
          capacity: 2300
          sub_categories: "Gadgets (only one of each can be owned)"
        - name: "Quest"
          icon: "Scroll icon"
          capacity: "Unlimited"
          sub_categories: "Quest items (cannot be deleted)"
        - name: "Precious Items"
          icon: "Crown/treasure icon"
          capacity: "Varies"
          sub_categories: "Crown of Insight, Nameless Ward, etc."
        - name: "Furnishings"
          icon: "Chair/furniture icon"
          capacity: 2600
          sub_categories: "Furnishings, Furnishing Sets, Landscape, Interior"

    item_grid:
      position: "Center, scrollable grid"
      description: "Grid of item icons sorted by rarity/quantity. Each shows icon, quantity, and rarity stars."
      interaction: "Click to select, double-click or right-click for quick actions"

    detail_panel:
      position: "Right side"
      contents:
        - "Item icon (large)"
        - "Item name"
        - "Rarity stars"
        - "Description text"
        - "Source/obtain method"
        - "Use button (for consumables)"
        - "Lock/Unlock toggle"
        - "Destroy button (if applicable)"

    sort_filter:
      position: "Top of grid area"
      sort_options:
        - "Quality (rarity)"
        - "Quantity"
        - "Name"
        - "Acquisition Time"
      filter_options:
        - "Rarity: 5/4/3/2/1 stars"
        - "Equipped status (for weapons/artifacts)"
        - "Locked/Unlocked"

  quick_actions:
    use_item: "Select consumable -> Click 'Use' -> Amount selector appears -> Confirm"
    lock: "Select item -> Click lock icon -> Prevents accidental destruction/use as fodder"
    destroy: "Select item -> Click 'Destroy' -> Confirmation dialog -> Item removed"
    enhance_from_inventory: "Select weapon/artifact -> 'Enhance' button"

  special_items:
    condensed_resin:
      max_quantity: 5
      crafting: "40 Original Resin + 1 Crystal Core at alchemy table"
      note: "Cap shown in inventory. Cannot exceed 5."
    fragile_resin:
      max_quantity: "No hard cap"
      use: "Restores 60 Original Resin"
    enhancement_ore:
      types: ["Enhancement Ore (2k EXP)", "Fine Enhancement Ore (6k EXP)", "Mystic Enhancement Ore (12k EXP)"]
      max_stack: 99999

  navigation:
    open_from: "World HUD (B) or Paimon Menu -> Inventory"
    close_to: "Esc returns to world (or Paimon menu if opened from there)"
    tab_switch: "Click category tabs on left side"
    item_select: "Click item in grid to view details"
    use_flow: "Select item -> Use button -> Quantity picker -> Confirm"

  visual_state_changes:
    - "Selected item highlights with golden border in grid"
    - "Locked items show padlock icon in corner"
    - "Equipped weapons/artifacts show character portrait badge"
    - "New items may have 'NEW' indicator"
    - "Full-capacity warnings appear when approaching limit"

  pitfalls:
    - "Destroying items is irreversible - always lock valuable items first"
    - "Using enhancement ores from inventory is slower than from Character > Enhance screen"
    - "Quest items tab cannot be managed - items auto-added/removed by quests"
    - "Furnishings capacity (2600) fills quickly in Serenitea Pot"
    - "Gadgets can only have ONE copy - using 'Use' equips it, not consumes it"
    - "Condensed Resin cap of 5 is easy to forget during resin planning"

# =============================================================================
# SECTION 7: MAP SCREEN (M)
# =============================================================================
map_screen:
  hotkey: "M"
  layout:
    description: "Full-screen map overlay with the game world map, region tabs, markers, and tools."
    map_area:
      position: "Center (majority of screen)"
      description: "Scrollable, zoomable top-down map of Teyvat and sub-areas."
      zoom_levels:
        min: "Shows entire regions"
        max: "Shows individual item/resource locations"
      navigation: "WASD to pan, scroll wheel to zoom, click to place marker"

    region_tabs:
      position: "Top-center or left side"
      tabs:
        - name: "Teyvat (overworld)"
          regions: ["Mondstadt", "Liyue", "Inazuma", "Sumeru", "Fontaine", "Natlan", "Nod-Krai"]
        - name: "Enkanomiya"
          description: "Underwater area below Inazuma, separate map layer"
        - name: "The Chasm: Underground"
          description: "Underground mines, separate map layer"
        - name: "Sea of Bygone Eras"
          description: "Sub-area in Fontaine region"
        - name: "Ancient Sacred Mountain"
          description: "Sub-area in Natlan region"
        - name: "Serenitea Pot"
          description: "Housing instance, separate map"
        - name: "Cat's Tail"
          description: "Genius Invokation TCG arena"
        - name: "Imaginarium Theater Lobby"
          description: "Theater lobby instance"
        - name: "Event Maps"
          description: "Temporary event-specific maps during events"

    marker_types:
      teleport_waypoint:
        icon: "Blue diamond/chevron"
        description: "Fast travel point. Unlocked (bright) vs locked (dimmed)."
        interaction: "Click to teleport. Locked waypoints require in-world activation."
      statue_of_the_seven:
        icon: "Statue figure"
        description: "Region-specific, restores HP, provides stamina upgrades, reveals map"
        interaction: "Click to teleport. Offers healing mode, statue's blessings."
      domain:
        icon: "Pillar/tower shape"
        description: "Instance entrance for artifacts, weapon mats, talent mats, weekly bosses"
        interaction: "Click to teleport. Shows domain name and type."
      oculi:
        types: ["Anemoculus", "Geoculus", "Electroculus", "Dendroculus", "Hydroculus", "Pyculus"]
        icon: "Star-shaped element icon"
        description: "Collectible for Statue offerings. Resonance Stone gadget helps locate."
      chest:
        types: ["Common", "Exquisite", "Precious", "Luxurious", "Remarkable"]
        icon: "Chest icon of varying detail"
        description: "Loot containers. Only shown if nearby or revealed."
      custom_pins:
        max_pins: 300
        icon: "User-selected pin icon (multiple icon options)"
        description: "Player-placed markers. Click to place, right-click to remove."
        creation: "Click empty map area -> Place Pin -> Select icon -> Add description"

    toolbar:
      position: "Right side, vertical"
      tools:
        - name: "Pin"
          icon: "Pin/marker icon"
          action: "Place custom pin at clicked location"
        - name: "Measure Distance"
          icon: "Ruler icon"
          action: "Click two points to measure distance"
        - name: "Custom Markers"
          icon: "Filter icon"
          action: "Toggle visibility of different marker types"
        - name: "Domain Names"
          icon: "List icon"
          action: "Show/hide domain names on map"
        - name: "Player Search"
          icon: "Magnifying glass"
          action: "Search for player pins (Co-Op)"

    search_bar:
      position: "Top of map area"
      description: "Search for locations, domains, quests by name"

    teleport_confirmation:
      description: "When clicking a teleport point, a confirmation popup appears"
      contents:
        - "Location name"
        - "Distance from current position"
        - "'Teleport' button (confirm)"
        - "'Cancel' button"

    map_settings:
      position: "Bottom or side panel"
      options:
        - "Show Custom Markers (toggle)"
        - "Show Domain Names (toggle)"
        - "Show Resource Icons (based on zoom level)"
        - "Player Location Sharing"

    condensed_resin_display:
      version: "5.7+"
      position: "Top-right area of map"
      description: "Shows Original Resin count and Condensed Resin count directly on map screen"
      format: "Original Resin: X/200 | Condensed Resin: X/5"

  navigation:
    open_from: "World HUD (M) or Paimon Menu -> Map"
    close_to: "Esc or M returns to world HUD"
    teleport_flow: "Click waypoint/statue/domain -> Teleport confirmation -> Loading screen -> Arrive at location"
    region_switch: "Click region tabs to switch between overworld and sub-areas"
    pin_management: "Click map -> Place pin -> Select icon -> Confirm; Right-click pin -> Delete"

  visual_state_changes:
    - "Unlocked waypoints bright, locked waypoints dimmed with lock icon"
    - "Active quest tracking shows golden path/marker"
    - "Zoom reveals more detail (NPCs, resources at max zoom)"
    - "Discovered areas fully colored, undiscovered areas dark/fogged"

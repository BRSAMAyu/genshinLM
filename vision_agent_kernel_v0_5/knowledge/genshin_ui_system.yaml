      - "3-star: Purple/blue meteor trail (most common)"
      - "4-star: Purple/pink meteor trail"
      - "5-star: Golden meteor trail"
    skip: "Click or press any key to skip animation"
    multi_pull: "Wish x10 shows condensed results screen with all 10 items"

  navigation:
    open_from: "World HUD (F3) or Paimon Menu -> Wish"
    close_to: "Esc or click close button"
    banner_switch: "Click banner tabs to switch between active banners"
    details_view: "Click 'Details' on banner to see full rate-up items and base rates"

  visual_state_changes:
    - "Banner artwork animates (character moves/effects)"
    - "Pull animation plays before showing results"
    - "5-star gold flash is unmistakable"
    - "Results screen shows all items from pull with rarity colors"

  pitfalls:
    - "Wish x10 does NOT guarantee 5-star - only guarantees 4-star+ every 10 pulls"
    - "Character Event Wish-1 and Wish-2 share pity counter - pulls on either count toward pity"
    - "Skipping animation too fast may miss the gold/purple indicator"
    - "History page only shows last 6 months - older pulls cannot be verified"

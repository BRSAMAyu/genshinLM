        - "Recommended elements"

  visual_state_changes:
    - "HP bar color changes: green (healthy) -> yellow (damaged) -> red (critical)"
    - "Skill icons gray out during cooldown, show timer number"
    - "Burst icon fills with energy (visual gauge), glows when ready"
    - "Minimap quest marker rotates as player turns"
    - "Death screen desaturates entire game view"
    - "Dialogue text types in character-by-character"
    - "Notifications slide in from right, fade out after delay"
    - "Loading screen appears during teleport and domain entry"

  pitfalls:
    - "Minimap is circular, distorting directions at edges"
    - "Skill cooldown timers are approximate, not frame-precise"
    - "Notification stack can obscure important quest updates"
    - "Death in Co-Op: must wait for teammate revive or auto-revive timer"
    - "Loading screens can be long on slow storage (HDD)"

# =============================================================================
# SECTION 16: CONFIRMATION DIALOGS
# =============================================================================
confirmation_dialogs:
  description: "Modal popups requiring player confirmation before proceeding."
  layout:
    position: "Center of screen, modal overlay"
    contents:
      - "Dialog title/header text"
      - "Description body (what will happen)"
      - "Confirm button (often right, prominent)"
      - "Cancel button (often left, secondary)"
    styling: "Semi-transparent dark backdrop. Dialog box has golden/brown Genshin UI theme."

  dialog_types:
    destructive_actions:
      description: "Actions that permanently destroy or consume items"
      examples:
        - "Destroy item: 'Are you sure you want to destroy [Item Name]? This action cannot be undone.'"
        - "Salvage artifact (v5.0+): 'The selected artifacts will be destroyed for [XP Material].'"
        - "Unequip artifact: 'This will remove the artifact from [Character].'"
        - "Use fragile resin: 'Use Fragile Resin to restore 60 Original Resin?'"
      behavior: "Single confirmation. Confirm/Cancel buttons."

    high_value_actions:
      description: "Actions involving premium or rare resources"
      examples:
        - "Wish/Pull: 'Spend [X] Primogems/Crystals for [X] Wish(es)?'"
        - "Character ascension: 'Ascend [Character] to Phase [X]? (consumes materials and Mora)'"
        - "Weapon refinement: 'Refine [Weapon] using [Duplicate]? This will consume the duplicate.'"
      behavior: "Single confirmation. Some have quantity selector before confirm."

    teleport:
      description: "Confirming fast travel"
      example: "Teleport to [Location Name]?"
      buttons: "'Teleport' / 'Cancel'"
      behavior: "Single confirmation."

    quest_actions:
      description: "Starting or abandoning quests"
      examples:
        - "Start quest: '[Quest Name] - Begin this quest?'"
        - "Abandon quest: 'Abandon [Quest Name]? Progress will be lost.'"
      behavior: "Single confirmation."

    party_change:
      description: "Changing party in restricted contexts"
      example: "Changing party will exit current domain/instance. Continue?"
      behavior: "Single confirmation with warning."

    multiplayer:
      description: "Co-Op related confirmations"
      examples:
        - "Join [Player]'s world?"
        - "Allow [Player] to join your world?"
        - "Kick [Player] from your world?"
      behavior: "Single confirmation."

    trade_exchange:
      description: "Shop/exchange confirmations"
      examples:
        - "Purchase [Item] for [X] Mora/Stardust/Starglitter?"
        - "Exchange [X] Stardust for [5] Intertwined Fates?"
      behavior: "Quantity selector then confirm."

  navigation:
    confirm: "Click Confirm button or press Enter"
    cancel: "Click Cancel button or press Esc"
    note: "Some dialogs can be dismissed by clicking outside the dialog area"

  visual_state_changes:
    - "Dialog appears with fade-in animation"
    - "Confirm button often styled in gold/bright color"
    - "Cancel button styled in gray/dark color"
    - "Backdrop dims the game world behind dialog"

  pitfalls:
    - "No undo for confirmed destructive actions - verify before clicking"
    - "Some rapid sequences of dialogs can cause accidental double-confirm"
    - "Dialog position is always center screen, can overlap important UI"
    - "Keyboard Enter confirms - don't accidentally press Enter while reading"
    - "Wish dialogs don't show pity count - easy to lose track of pulls"

# =============================================================================
# SECTION 17: NOTIFICATION SYSTEM
# =============================================================================
notification_system:
  hotkey: "Y"
  layout:
    description: "In-game notification panel accessible from HUD and Paimon Menu."
    notification_types:
      map_notifications:
        position: "Top-right of screen, fade in/out during gameplay"
        reference_roi: "1400,100 to 1900,500 at 1920x1080"
        types:
          - "Quest objective updates"
          - "Item obtained notifications"
          - "Achievement unlocked"
          - "Daily commission completion"
          - "Resin fully recovered"
          - "Domain completion rewards"
          - "Friend requests"
          - "Co-Op join/leave notifications"
        behavior: "Auto-dismiss after ~5 seconds. Stack vertically when multiple appear."

      notification_panel:
        access: "Y key or Paimon Menu -> Notifications"
        layout:
          position: "Full-screen overlay"
          tabs:
            - name: "Notices"
              description: "Official game announcements, maintenance notices, version updates"
              contents: "Scrollable list of notice cards with timestamps"
            - name: "Events"
              description: "Current event summaries and reminders"
              contents: "Event cards with remaining time"
            - name: "Mail"
              description: "In-game mailbox"
              contents: "List of received mail items"
              actions:
                - "Read mail"
                - "Claim attachments (items, primogems)"
                - "Delete mail (after claiming)"

      mail_system:
        access: "Notification Panel > Mail tab"
        layout:
          position: "Full-screen overlay"
          mail_list:
            position: "Left panel"
            format: "Sender icon, subject line, time received, read/unread indicator"
          mail_content:
            position: "Right panel"
            contents:
              - "Sender name"
              - "Subject"
              - "Mail body text"
              - "Attachments (items)"
              - "'Claim All' or 'Claim' button for attachments"
              - "'Delete' button"
        restrictions:
          - "Mail expires after 30 days (type-dependent)"
          - "Some mail cannot be deleted until attachment is claimed"
          - "Gift mail (from friends) has shorter expiry"

    notification_settings:
      access: "Settings > Other > Event Notifications"
      options:
        - "Toggle specific notification types on/off"
        - "Resin recovery notification threshold"
        - "Expedition completion notification"

  navigation:
    open_from: "Y key or Paimon Menu -> Notifications"
    close_to: "Esc returns to world or Paimon menu"
    mail_flow: "Open Mail tab -> Select mail -> Read -> Claim attachment -> Delete"

  visual_state_changes:
    - "Unread mail has gold dot/indicator"
    - "Read mail has no indicator"
    - "New notifications slide in from right side of screen"
    - "Notification count badge appears on bell icon in Paimon menu"
    - "Claimed attachments show checkmark"

  pitfalls:
    - "Mail expires - unclaimed items in expired mail are lost permanently"
    - "Map notifications auto-dismiss - important updates can be missed during combat"
    - "Claim All in mail claims EVERYTHING - verify before using"
    - "Some event mail has very short expiry (7 days vs 30 days)"
    - "Notification panel doesn't show map notification history - once dismissed, it's gone"

# =============================================================================
# SECTION 18: ADDITIONAL SCREENS AND SYSTEMS
# =============================================================================
additional_screens:
  quest_menu:
    hotkey: "J"
    layout:
      description: "Full-screen quest log with active, archived, and world quests."
      tabs:
        - name: "Story Quests"
          contents: "Archon Quests, Story Quests, Hangout Events"
        - name: "World Quests"
          contents: "Region-specific side quests"
        - name: "Commissions"
          contents: "Daily commission status"
        - name: "Archived"
          contents: "Completed quests"
      per_quest:
        - "Quest name and chapter"
        - "Current objective"
        - "'Navigate' button (sets map marker)"
        - "'Abandon' button (for repeatable/world quests)"
    navigation:
      open_from: "J key or Paimon Menu -> Quests"
      close_to: "Esc"

  friends_list:
    hotkey: "O"
    layout:
      description: "Friends management screen"
      contents:
        - "Online friends list with status"
        - "Offline friends list"
        - "Add friend (by UID)"
        - "Recent players"
        - "Block list"
    actions:
      - "Send friend request"
      - "Join friend's world (if Co-Op allowed)"
      - "Remove friend"
      - "Block player"

  chat:
    hotkey: "Enter"
    layout:
      position: "Bottom-left overlay"
      description: "Text chat panel"
      modes:
        - "All (visible to all nearby in Co-Op)"
        - "Party (party members only)"
        - "Private (whisper to specific friend)"
      auto_open: "Opens when pressing Enter during gameplay"
    pitfalls:
      - "Chat input captures keyboard - character won't respond to movement keys while typing"
      - "Press Enter again or Esc to close chat and resume gameplay"

  tutorials:
    hotkey: "G"
    layout:
      description: "Library of gameplay tutorials"
      contents: "Categorized list of tutorial entries with images and text"
      categories: ["Combat", "Exploration", "Elements", "Progression", "Systems"]
    navigation:
      open_from: "G key or Paimon Menu -> Tutorials"
      close_to: "Esc"

  elemental_sight:
    hotkey: "Middle Mouse Button (hold)"
    layout:
      description: "Overlay mode showing elemental traces in the game world"
      visual: "Screen tints blue/purple. Interactive objects highlighted with element-colored outlines."
      duration: "Hold to maintain, releases when button released"
    uses:
      - "Find hidden objects and chests"
      - "Track elemental trails for investigations"
      - "Identify element type of enemies/shields"
    pitfalls:
      - "Must HOLD middle mouse - releasing deactivates immediately"
      - "Character cannot attack while Elemental Sight is active"
      - "Movement is slowed during Elemental Sight"

  shortcut_wheel:
    hotkey: "Tab"
    layout:
      description: "Radial menu for quick access to common actions"
      position: "Center of screen, circular wheel"
      slots:
        - "Party Setup"
        - "Quest Menu"
        - "Inventory"
        - "Map"
        - "Character Menu"
        - "Adventurer Handbook"
        - "Other common screens"
      interaction: "Hold Tab, move mouse to select, release Tab to confirm"
    pitfalls:
      - "Must hold Tab and select - releasing without selecting does nothing"
      - "Can accidentally select wrong option if mouse drifts"

# =============================================================================
# SECTION 19: SCREEN STATE MACHINE FOR AGENT NAVIGATION
# =============================================================================
screen_state_machine:
  description: "State transitions for autonomous agent navigation between all screens."

  states:
    world_hud:
      description: "Normal gameplay with HUD visible"
      indicators: ["minimap", "hp_bar", "skill_icons"]
      transitions:
        Esc: "paimon_menu"
        B: "inventory"
        C: "character_menu"
        M: "map"
        J: "quest_menu"
        L: "party_setup"
        F1: "adventurer_handbook"
        F2: "coop_mode"
        F3: "wish_screen"
        F4: "battle_pass"
        F5: "events_panel"
        Y: "notifications"
        O: "friends_list"
        Enter: "chat"
        G: "tutorials"
        Tab: "shortcut_wheel"
        F_or_interaction: "dialog"
        death: "death_screen"

    paimon_menu:
      description: "Paused game, central hub"
      indicators: ["dark_overlay", "profile_section", "contents_grid"]
      transitions:
        Esc: "world_hud"
        right_click: "world_hud"
        click_button: "any_sub_menu"
        click_inventory: "inventory"
        click_character: "character_menu"
        click_map: "map"
        click_settings: "settings"

    inventory:
      description: "Item management screen"
      indicators: ["tab_bar_left", "item_grid_center", "detail_panel_right"]
      transitions:
        Esc: "world_hud"
        tab_click: "switch_inventory_category"

    character_menu:
      description: "Character details screen"
      indicators: ["character_model", "tab_bar_right", "character_strip_bottom"]
      transitions:
        Esc: "world_hud"
        tab_click: "switch_character_sub_tab"
        character_click: "switch_character_view"

    map:
      description: "World map overlay"
      indicators: ["map_area", "region_tabs", "marker_icons"]
      transitions:
        Esc: "world_hud"
        M: "world_hud"
        waypoint_click: "teleport_confirm"
        pin_place: "custom_pin_created"

    dialog:
      description: "NPC conversation active"
      indicators: ["dialog_box_bottom", "speaker_name", "dialogue_text"]
      transitions:
        F_or_click: "advance_dialog"
        choice_select: "dialog_branch"
        Esc: "skip_dialog (if skippable)"

    death_screen:
      description: "Character has fallen"
      indicators: ["gray_desaturated", "revive_button", "statue_button"]
      transitions:
        click_revive: "world_hud (with food consumption)"
        click_statue: "world_hud (teleported to statue)"

    loading_screen:
      description: "Loading/transition screen"
      indicators: ["dark_frame", "loading_indicator", "tip_text"]
      transitions:
        load_complete: "destination_screen"

    combat:
      description: "Active combat with enemies"
      indicators: ["minimap", "hp_bar", "combat_indicator", "enemy_hp_bars"]
      transitions:
        all_enemies_dead: "world_hud"
        character_death: "death_screen"
        Esc: "paimon_menu"

  universal_navigation_rules:
    - "Esc almost universally returns to the previous screen or closes current overlay"
    - "From any sub-menu, first Esc returns to Paimon menu, second Esc returns to world"
    - "Direct hotkeys (B, C, M, etc.) open screens directly from world HUD, bypassing Paimon menu"
    - "Right-click often works as 'back' in menus"
    - "Enter confirms dialog selections"
    - "Loading screens cannot be skipped (except wish animations)"

# =============================================================================
# SECTION 20: COMMON AGENT PITFALLS SUMMARY
# =============================================================================
agent_pitfalls:
  timing:
    - "Daily reset at 4:00 AM server time (not local time)"
    - "Weekly reset Monday 4:00 AM server time"
    - "BP season end is a specific date - no grace period"
    - "Event timers show server time"

  screen_navigation:
    - "Two Esc presses needed from sub-menu to world (sub-menu -> Paimon -> world)"
    - "Hotkeys bypass Paimon menu - use direct hotkeys for efficiency"
    - "Chat input mode captures keyboard - agent must detect and close chat"
    - "Elemental Sight requires HOLD, not toggle"
    - "Tab shortcut wheel requires hold-and-select, not click"

  visual_detection:
    - "Dark screen could be: Paimon menu, loading screen, death screen, or domain entrance"
    - "Classifier must check multiple ROIs to disambiguate dark states"
    - "Minimap presence distinguishes world_hud from menu screens"
    - "Notification area can overlap with other UI elements"
    - "HP bar color indicates health state (green/yellow/red)"

  interaction_traps:
    - "Confirm dialogs for destructive actions have no undo"
    - "Artifact salvage is irreversible"
    - "Wish animations can be skipped but pity is invisible"
    - "Domain entry requires party selection - wrong team = wasted resin"
    - "Co-Op disables certain single-player features"
    - "Teleporting during combat works but is disorienting"

  resource_management:
    - "Original Resin: 200 cap, regenerates 1 per 8 minutes"
    - "Condensed Resin: Max 5, crafted at alchemy table"
    - "Inventory caps differ per category (2000 weapons, 2400 artifacts, etc.)"
    - "300 map pin limit"
    - "Battle Pass level 50 cap - excess XP wasted"
    - "Stardust exchange resets monthly"

        - name: "Character Event Wish"
          currency: "Intertwined Fate"
          pity: "90 pulls hard pity, 50/50 system at soft pity ~74"
        - name: "Character Event Wish-2"
          currency: "Intertwined Fate"
          description: "Second concurrent character banner (shares pity with Wish-1)"
        - name: "Weapon Event Wish"
          currency: "Intertwined Fate"
          pity: "80 pulls hard pity, epitomized path system (choose weapon)"

# Genshin Impact detection model configuration
# For use with Ultralytics YOLO training pipeline

# Dataset paths
dataset:
  name: genshin_detection_v1
  path: datasets/genshin
  train_split: 0.8
  export_format: yolov8

# Detection class hierarchy
classes:
  # === Enemies ===
  0: monster_normal        # Hilichurls, Slimes, Treasure Hoarders
  1: monster_elite         # Mitachurls, Ruin Guards, Fatui Agents
  2: monster_boss          # Boss enemies (multi-segment HP)

  # === Collectibles ===
  3: ore                   # All ore types (iron, crystal, starsilver, amethyst)
  4: plant                 # All plant types (flowers, mushrooms, fruits, specialties)
  5: chest                 # All chest types (common, exquisite, precious, luxurious)
  6: loot_beam             # Drop item light beams

  # === UI Elements ===
  7: interaction_prompt    # F-key interaction prompt
  8: hp_bar_enemy          # Enemy HP bar (top of screen)
  9: danger_zone           # Red circle / red flash danger indicator

# Training configuration
training:
  model: yolov8n.pt        # Base model (nano for speed)
  # Alternative: yolov11n.pt for higher accuracy
  epochs: 100
  batch_size: 16
  image_size: 640
  device: cpu              # Change to 0 for GPU
  patience: 20             # Early stopping patience
  augment: true
  mosaic: 1.0
  mixup: 0.1
  hsv_h: 0.015
  hsv_s: 0.7
  hsv_v: 0.4
  degrees: 0.0
  translate: 0.1
  scale: 0.5
  fliplr: 0.5
  flipud: 0.0

# Inference configuration (for deployment)
inference:
  conf_threshold: 0.35
  iou_threshold: 0.5
  max_det: 20
  device: cpu
  half: false

# External datasets available for download
external_datasets:
  - name: "Genshin Monster XJTLU MERGED"
    url: "https://universe.roboflow.com/genshindetection-uzjmm/genshin-monster-xjtlu-merged"
    images: 1905
    classes: 44
    format: "YOLOv8"
    license: "Public Domain"
    note: "Competition dataset with detailed monster subclasses (Hilichurl, Slime-PYRO, Abyss_mage-CRYO, etc.)"

  - name: "Genshin Impact YOLO"
    url: "https://universe.roboflow.com/absk-1skxf/genshin-impact-yolo"
    images: 100
    classes: "Various"
    format: "YOLOv8"
    note: "Small dataset with pre-trained model"

  - name: "Genshin Impact Anime Character"
    url: "https://universe.roboflow.com/l-eqpbq/genshin-impact-anime-character"
    images: 1526
    classes: "Character classes"
    format: "YOLOv8"
    note: "Character detection dataset"

